                "Indica que la llanta es de forja de alta resistencia (Forged High).",
                "Identifica el resalte de la llanta de tipo flat hump (joroba plana)."
            ],
            correctaTexto: "Identifica el resalte de la llanta de tipo flat hump (joroba plana).",
            justificacion: "'FH' responde a Flat Hump, un perfil de joroba aplanada."
        },
        {

            opciones: [
                "Sumergir la llanta en gasolina super 95 durante 1 hora.",
                "Lijar la cara interna del neumático hasta eliminar la capa de estanqueidad.",
                "Retirar las piedras incrustadas en el dibujo y lavar a fondo la llanta para eliminar suciedad adherida que actúa como contrapeso.",
                "Llenar la garganta con espuma expansiva de poliuretano."
            ],
            correctaTexto: "Retirar las piedras incrustadas en el dibujo y lavar a fondo la llanta para eliminar suciedad adherida que actúa como contrapeso.",
            justificacion: "Grava o barro seco suman masa parásita que desbalancea el conjunto."
        },
        {
            pregunta: "¿De qué color son los tapones de las válvulas en las ruedas infladas con nitrógeno para su correcta identificación en el taller?",
            opciones: [

            justificacion: "El estándar de talleres utiliza tapones verdes para identificar el inflado con nitrógeno."

        {
            pregunta: "¿Qué distancia física define el ancho de una llanta?",
            opciones: [
                "El diámetro total medido en el centro del cubo de rueda.",
                "La distancia exterior entre los bordes de la pestaña.",
                "La distancia interior entre las dos pestañas de la llanta.",
                "La distancia entre los orificios de los pernos de sujeción."
            ],
            correctaTexto: "La distancia interior entre las dos pestañas de la llanta.",
            justificacion: "El ancho se mide estrictamente entre las caras internas de las dos pestañas."

    ];

    let quizDataActivo = [];
    let tiempoSegundos = 0;
    let timerInterval = null;

    function iniciarCronometro() {
        tiempoSegundos = 0;
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            tiempoSegundos++;
            let minutos = Math.floor(tiempoSegundos / 60);
            let segundos = tiempoSegundos % 60;
            let minStr = minutos < 10 ? "0" + minutos : minutos;
            let segStr = segundos < 10 ? "0" + segundos : segundos;
            document.getElementById("cronometro").innerText = `Tiempo transcurrido: ${minStr}:${segStr}`;
        }, 1000);
    }

    function mezclarArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function iniciarTest() {
        quizDataActivo = mezclarArray(quizDataOriginal).map(q => {
            return {
                pregunta: q.pregunta,
                opciones: mezclarArray(q.opciones),
                correctaTexto: q.correctaTexto,
                justificacion: q.justificacion
            };
        });

        const container = document.getElementById("questionsContainer");
        let html = "";
        
        quizDataActivo.forEach((q, index) => {
            html += `<div class="question-card" id="card-${index}">
                <div class="question-title">${index + 1}. ${q.pregunta}</div>
                <div class="options">`;
            q.opciones.forEach((opt) => {
                html += `<label>
                    <input type="radio" name="pregunta-${index}" value="${encodeURIComponent(opt)}"> ${opt}
                </label>`;
            });
            html += `</div></div>`;
        });
        
        container.innerHTML = html;

        document.getElementById("report-view").classList.add("hidden");
        document.getElementById("quiz-view").classList.remove("hidden");
        window.scrollTo(0, 0);
        iniciarCronometro();
    }

    function enviarWebhookDiscord(aciertos, fallos, total, porcentaje, tiempoFormateado) {
        if (!WEBHOOK_URL) return;

        let mensaje = {
            embeds: [{
                title: "📊 Nuevo Test Completado (Anónimo)",
                color: porcentaje >= 50 ? 3066993 : 15158332,
                fields: [
                    { name: "🏆 Calificación", value: `${porcentaje}% (${aciertos}/${total})`, inline: true },
                    { name: "⏱️ Tiempo", value: tiempoFormateado, inline: true },
                    { name: "✅ Aciertos", value: `${aciertos}`, inline: true },
                    { name: "❌ Fallos", value: `${fallos}`, inline: true }
                ],
                timestamp: new Date().toISOString()
            }]
        };

        fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(mensaje)
        }).catch(err => console.error("Error silencioso al enviar webhook", err));
    }

    function corregirYMostrarInforme() {
        clearInterval(timerInterval);
        
        let aciertos = 0;
        let informeHtml = "";

        quizDataActivo.forEach((q, index) => {
            const seleccionada = document.querySelector(`input[name="pregunta-${index}"]:checked`);
            const valorSeleccionado = seleccionada ? decodeURIComponent(seleccionada.value) : null;
            const esAcertada = (valorSeleccionado === q.correctaTexto);

            if (esAcertada) aciertos++;

            const estadoClase = esAcertada ? "correct-report" : "incorrect-report";
            const badgeClase = esAcertada ? "badge-correct" : "badge-incorrect";
            const badgeTexto = esAcertada ? "ACERTADA" : "FALLADA";

            informeHtml += `
                <div class="report-item ${estadoClase}">
                    <span class="status-badge ${badgeClase}">${badgeTexto}</span>
                    <div class="question-title">Pregunta ${index + 1}: ${q.pregunta}</div>
                    <p><strong>Tu respuesta:</strong> ${valorSeleccionado !== null ? valorSeleccionado : '<i>No respondida</i>'}</p>
                    <p><strong>Respuesta correcta:</strong> ${q.correctaTexto}</p>
                    <div class="justification">
                        <strong>Justificación técnica:</strong> ${q.justificacion}
                    </div>
                </div>
            `;
        });

        let fallos = quizDataActivo.length - aciertos;
        let porcentaje = Math.round((aciertos / quizDataActivo.length) * 100);
        
        let minutos = Math.floor(tiempoSegundos / 60);
        let segundos = tiempoSegundos % 60;
        let tiempoFormateado = `${minutos} min ${segundos} seg`;

        // Envío oculto y automático al Webhook de Discord
        enviarWebhookDiscord(aciertos, fallos, quizDataActivo.length, porcentaje, tiempoFormateado);

        document.getElementById("quiz-view").classList.add("hidden");
        document.getElementById("report-view").classList.remove("hidden");

        document.getElementById("results-summary").innerHTML = `Resultado final: ${aciertos} de ${quizDataActivo.length} aciertos (${porcentaje}%) <br><span style="font-size: 1rem; color: var(--text-muted);">Tiempo empleado: ${tiempoFormateado}</span>`;
        document.getElementById("report-container").innerHTML = informeHtml;
        window.scrollTo(0, 0);
    }

    window.onload = iniciarTest;
</script>
